name: benchmark

# (Touch to register this workflow_dispatch workflow with GitHub Actions.)
# Hilbert GitHub Actions execution provider: this workflow IS the grader.
# Hilbert builds a candidate ref (validated baseline + the submission's
# src/ordering/ only) and dispatches THIS workflow on it; the score artifact is
# the machine-readable channel it reads back.
#
# Dispatch-only by design: no `pull_request` trigger. Hilbert (or an explicit
# maintainer click) is the only thing that may start paid runner minutes, and
# head-SHA correlation works regardless of what triggered the run. Adding a
# `pull_request` trigger would let fork/maintainer PRs start runs and would
# double-run every Hilbert submission.
on:
  workflow_dispatch:

# The workflow needs no Hilbert credentials: the dispatched ref already IS the
# payload, and Hilbert posts the score table on the PR itself. Read-only repo
# access is all the grading run requires.
permissions:
  contents: read

# One run per ref; retried dispatches for the same attempt dedupe. Do NOT
# cancel in progress — a near-complete grading run should finish, not be killed
# by a re-dispatch.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
        with:
          # The dev corpus is a Git LFS object. When no eval bucket is
          # configured, the self-grade reads the committed dev corpus, so the
          # runner must fetch LFS bytes (default is lfs: false → pointer file).
          # When an eval bucket IS configured, grading uses SSI_CORPUS_FILE and
          # never reads this file; fetching it is a small, harmless cost.
          lfs: true

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned); honors the repo's rust-toolchain file

      # cargo-deny is REQUIRED for grading (the harness runs in RequireDeny mode):
      # the license/source gate is authoritative now that submissions may declare
      # crates. A missing cargo-deny is a hard failure, not a fallback.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      # Bubblewrap is used twice: once around the release build (where
      # dependency build.rs/proc macros can execute), then independently around
      # every order() worker. Package installation is the only root operation;
      # the trusted grader parent and all untrusted code run as the runner user.
      #
      # prlimit (util-linux) wraps every worker's bwrap to carry the per-worker
      # rlimits, so grader mode fails closed without it. It ships in the base
      # image rather than a package we install; assert it here so a missing tool
      # is one clear line instead of every worker exiting nonzero with its
      # stderr on /dev/null.
      - name: Install sandbox tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          bwrap --version
          prlimit --version

      # Ubuntu 24.04 (the ubuntu-latest image) enables an AppArmor policy that
      # restricts unprivileged user namespaces, which stops bubblewrap from
      # configuring loopback in its --unshare-net namespace (bwrap fails with
      # RTM_NEWADDR: Operation not permitted). Relax it so the unprivileged
      # grader sandbox can create its PID/network/filesystem namespaces. This
      # is the only namespace-related root operation; the trusted parent and
      # all untrusted code still run as the runner user.
      - name: Allow unprivileged user namespaces (Ubuntu 24.04)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Validate deps.toml, generate the trusted manifest, freeze the lockfile,
      # vendor the FULL transitive tree, and scan it for native/FFI escapes. This
      # is the ONLY step that uses the network (cargo vendor fetches from the
      # frozen crates.io snapshot); the build and the scored run are offline.
      - name: Prepare build (validate deps, vendor, scan tree)
        run: bash scripts/prepare-build.sh

      # Stable step name "Setup": a failure here maps to setup_failed. Build the
      # trusted parent and candidate package separately. Their clean target
      # directories are mounted one at a time, so candidate build scripts cannot
      # replace the parent executable. The eval corpus is fetched only later.
      - name: Setup
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          scripts/grader-sandbox.sh self-check
          scripts/grader-sandbox.sh trusted-build
          scripts/grader-sandbox.sh candidate-build

      # Runs the exact Rust command builder used for every order() call. It
      # gates on PID 1/private proc, no default route, empty environment,
      # /dev/null stdio, read-only input, hidden host paths, writable output, and
      # watchdog teardown of a candidate descendant.
      - name: Verify per-worker sandbox
        env:
          SSI_GRADER_SANDBOX: bubblewrap
          SSI_CANDIDATE_WORKER: ${{ github.workspace }}/target/candidate/release/ssi-candidate-worker
        run: |
          set -euo pipefail
          ./target/trusted/release/matrices-fast --grader --sandbox-self-check
          ./target/trusted/release/matrices-fast --grader --sandbox-timeout-self-check
          cargo test --offline --locked --package matrices-fast \
            sandbox::tests::bubblewrap_timeout_tears_down_candidate_descendants \
            -- --ignored

      # Fetch today's hidden EVAL corpus to a temp path OUTSIDE the repo tree, so
      # the eval bytes never sit at a tracked path and can never be committed.
      # When no eval bucket is configured, this is a no-op and the run grades the
      # committed PUBLIC dev corpus — proving the self-grading loop end to end
      # first.
      #
      # REQUIRED REPO SECRETS for real (hidden-corpus) grading. Secrets do not
      # travel with the source, so a fresh clone of this repo has none of them
      # and every run silently grades the PUBLIC dev corpus instead — the run
      # goes green and publishes a score that contestants could have computed
      # themselves, which is not a ranking. Recreate these before grading:
      #   EVAL_BUCKET_NAME      bucket holding the eval corpus. Also the switch:
      #                         unset ⇒ the dev-corpus fallback below.
      #   EVAL_BUCKET_KEY_ID    access key id, read-only on that bucket
      #   EVAL_BUCKET_SECRET    matching secret access key
      #   EVAL_BUCKET_ENDPOINT  S3-compatible endpoint URL; required for R2/GCS,
      #                         omit for AWS S3
      #   EVAL_BUCKET_REGION    region for that endpoint ("auto" on R2)
      # The bucket layout the fetch expects (eval/current.txt → a dated prefix
      # holding patterns.jsonl) is documented in
      # .github/scripts/fetch-eval-corpus.sh.
      - name: Fetch eval corpus
        id: corpus
        env:
          EVAL_BUCKET_NAME: ${{ secrets.EVAL_BUCKET_NAME }}
          EVAL_BUCKET_ENDPOINT: ${{ secrets.EVAL_BUCKET_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.EVAL_BUCKET_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EVAL_BUCKET_SECRET }}
          AWS_DEFAULT_REGION: ${{ secrets.EVAL_BUCKET_REGION }}
        run: |
          if [ -z "${EVAL_BUCKET_NAME:-}" ]; then
            echo "No EVAL_BUCKET_NAME secret set; grading the committed public dev corpus."
            echo "corpus_file=" >> "$GITHUB_OUTPUT"
          else
            ./.github/scripts/fetch-eval-corpus.sh "$RUNNER_TEMP/eval.jsonl"
            echo "corpus_file=$RUNNER_TEMP/eval.jsonl" >> "$GITHUB_OUTPUT"
          fi

      # Stable step name "Benchmark": a failure here maps to benchmark_failed.
      # SSI_CORPUS_FILE is the harness's corpus-path seam; when the fetch step
      # produced no eval file the value is empty, which the seam treats as unset
      # and falls back to the dev corpus (default-preserving).
      #
      # The trusted parent stays outside the sandbox to load/score the hidden
      # corpus. SSI_GRADER_SANDBOX makes each of the two order() runs per matrix
      # launch in its OWN bubblewrap PID/network/filesystem namespace. This is
      # deliberately not one shared namespace around the harness: a shared
      # /proc would expose trusted-parent memory to workers. Requested sandbox
      # mode fails closed if bubblewrap cannot establish the boundary.
      - name: Benchmark
        id: benchmark
        env:
          SSI_CORPUS_FILE: ${{ steps.corpus.outputs.corpus_file }}
          SSI_GRADER_SANDBOX: bubblewrap
          SSI_CANDIDATE_WORKER: ${{ github.workspace }}/target/candidate/release/ssi-candidate-worker
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          exec ./target/trusted/release/matrices-fast --grader

      # The score artifact is the channel Hilbert reads. A failed benchmark must
      # never publish a stale or worker-forged score; the harness also clears
      # score.json authoritatively before returning failure.
      - name: Upload score
        if: ${{ success() && steps.benchmark.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (SHA-pinned)
        with:
          name: score
          path: score.json
          if-no-files-found: ignore
