name: PR security regressions

on:
  pull_request:

permissions:
  contents: read

jobs:
  security-regressions:
    # This job-level guard is evaluated before a runner is assigned. Guarded
    # PRs therefore create only a skipped check and consume no runner minutes.
    #
    # Fork PRs are skipped: a fork's head is untrusted code, and the run gets
    # no secrets, so it proves nothing about this repo's merge gate.
    #
    # Yukon submission PRs are skipped: a Yukon app opens `submissions/<uuid>`
    # branches inside this repo, and every Yukon app is a bypass actor
    # (`bypass_mode: always`) on the `main protection` ruleset — as of this
    # commit two Integration actors, app ids 3891566 (`yukon-eigen[bot]`) and
    # 4231003. They land submissions without regard to any check on the PR, so
    # these steps gate nothing there and only burn runner minutes per
    # submission. Grading is the separate dispatch-only `benchmark` workflow,
    # which has no `pull_request` trigger and is untouched by this guard.
    #
    # The test is on the PR author's TYPE, not a list of bot logins: the
    # bypass list gains apps over time (it just went from one to two), and a
    # login allowlist silently stops matching the day a new one is added,
    # quietly resuming paid runs. Both halves are still required, because
    # `Bot` alone would also skip Dependabot-style PRs that this job should
    # gate. A human cannot spoof past it by naming a branch `submissions/...`
    # — `user.type` is set by GitHub, not by the PR author.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !(github.event.pull_request.user.type == 'Bot'
      && startsWith(github.event.pull_request.head.ref, 'submissions/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Prepare locked offline tree
        run: bash scripts/prepare-build.sh

      - name: Check formatting on changed Rust lines
        run: python3 .github/scripts/check-rustfmt-diff.py "${{ github.event.pull_request.base.sha }}"

      - name: Test purity policy offline
        run: cargo test --locked --offline -p ssi-purity

      - name: Test watchdog process isolation offline
        run: cargo test --locked --offline --bin matrices-fast watchdog::tests

      # `read_permutation` bounds an untrusted worker's output file by the staged
      # dimension inside the trusted parent. The workspace sets
      # `default-members = ["."]`, so a root `cargo test` never reaches this
      # crate; name it explicitly or the bound can regress unnoticed.
      - name: Test worker protocol bounds offline
        run: cargo test --locked --offline -p ssi-worker-protocol

      # The per-worker resource limits are argv the trusted command builder
      # emits: the root tmpfs size cap, the read-only /dev, and
      # the prlimit wrap carrying RLIMIT_FSIZE/NPROC/AS. The watchdog step above
      # filters to `watchdog::tests`, so it does not reach them.
      - name: Test per-worker sandbox limits offline
        run: cargo test --locked --offline --bin matrices-fast sandbox::tests

      # The time-cap integration tests drive the trusted parent, which spawns
      # the separately built ssi-candidate-worker; `cargo test --test time_cap`
      # alone would not build that sibling workspace package.
      - name: Build workspace for integration tests
        run: cargo build --release --locked --offline --workspace

      - name: Test enforced time cap offline
        run: cargo test --release --locked --offline --test time_cap

      # The worker half of the same defense: it asserts from inside the sandbox
      # that the caps are live. `default-members = ["."]` keeps a root
      # `cargo test` out of this crate, so name it explicitly. Reuses the
      # release artifacts the workspace build above already produced.
      - name: Test worker resource-limit assertions offline
        run: cargo test --release --locked --offline -p ssi-candidate-worker limit_tests
